<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>CANOPY | Physics Urban World</title>
<link rel="stylesheet" href="viewer/3d/opening.css">
</head>
<body>
<div id="loading" role="status" aria-labelledby="loading-scenario">
  <section class="loading-card">
    <div class="canopy-logo" aria-label="Canopy">CANOPY<span aria-hidden="true"></span></div>
    <h1 id="loading-scenario">Opening scenario</h1>
    <p id="loading-description">Preparing the selected scenario.</p>
    <div class="loading-progress">
      <span id="loading-title" class="loading-sr-only">Preparing scenario</span>
      <div class="track" role="progressbar" aria-label="Scenario download"><div id="bar"></div></div>
      <div class="loading-status"><p id="pct">Checking saved resources…</p><span id="percentage"></span></div>
      <button id="resume" hidden>Resume download</button>
    </div>
  </section>
</div>
<script type="module" src="preload.js"></script>
</body>
</html>

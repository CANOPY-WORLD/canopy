name: Scenario asset budgets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-budgets:
    name: Scenario asset budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test budget validation and rejection cases
        run: python -m unittest discover -s asset/tests -p 'test_budgets.py' -v
      - name: Enforce per-Scenario budgets against pinned remote bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python asset/tools/check_budgets.py --verify-remote --json cache/asset-budgets.json --summary "$GITHUB_STEP_SUMMARY"
